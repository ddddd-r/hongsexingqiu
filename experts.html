<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>红色星球 · 精选专家市场</title>
<style>
  :root{
    --red:#E2231A;          /* 品牌主红 */
    --red-deep:#B0141A;
    --red-soft:#FCEBEA;
    --gold:#E0B25C;         /* 高端点缀 */
    --ink:#161A2B;          /* 主文字 */
    --ink-2:#4A4F63;        /* 次文字 */
    --ink-3:#878CA0;        /* 辅助文字 */
    --line:#ECEEF4;
    --bg:#F6F7FB;
    --card:#FFFFFF;
    --radius:18px;
    --shadow:0 10px 30px rgba(22,26,43,.08);
    --shadow-sm:0 4px 14px rgba(22,26,43,.06);
    --space:linear-gradient(135deg,#1a0608 0%,#3a0a10 45%,#7a1318 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}

  /* ===== Header ===== */
  header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:.3px}
  .planet{width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,#ff6a5a 0%,var(--red) 42%,var(--red-deep) 100%);
    box-shadow:0 0 0 3px rgba(226,35,26,.14), inset -3px -3px 6px rgba(0,0,0,.25);position:relative}
  .planet::after{content:"";position:absolute;left:-5px;top:13px;width:40px;height:9px;border-radius:50%;
    border:2px solid rgba(224,178,92,.7);transform:rotate(-18deg)}
  .brand small{font-weight:600;color:var(--ink-3);font-size:12px;margin-left:2px}
  nav.links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}
  nav.links a:hover{color:var(--red)}
  nav.links a.active{color:var(--red);font-weight:700}
  .cta{background:var(--red);color:#fff;padding:9px 18px;border-radius:10px;font-weight:600;font-size:14px;
    transition:.2s;box-shadow:0 6px 16px rgba(226,35,26,.28)}
  .cta:hover{background:var(--red-deep);transform:translateY(-1px)}
  @media(max-width:760px){nav.links{display:none}}

  /* ===== Hero ===== */
  .hero{background:var(--space);color:#fff;position:relative;overflow:hidden}
  .hero .stars{position:absolute;inset:0;background-image:
    radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 70% 20%,#ffd,transparent),
    radial-gradient(1px 1px at 40% 70%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),
    radial-gradient(1px 1px at 55% 45%,#fff,transparent),
    radial-gradient(1px 1px at 10% 80%,#fff,transparent);opacity:.5}
  .hero .glow{position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ff7a5a 0%,var(--red) 45%,transparent 70%);filter:blur(6px);opacity:.55}
  .hero-inner{position:relative;padding-top:64px;padding-bottom:72px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:2px;
    color:var(--gold);font-weight:600;text-transform:uppercase;margin-bottom:16px}
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--gold)}
  .hero h1{font-size:38px;font-weight:800;line-height:1.25;letter-spacing:.5px}
  .hero h1 span{color:#ffb3ab}
  .hero p{margin-top:14px;font-size:16px;color:rgba(255,255,255,.82);max-width:560px}
  .hero-stats{display:flex;gap:38px;margin-top:30px}
  .hero-stats div b{font-size:26px;font-weight:800}
  .hero-stats div small{display:block;color:rgba(255,255,255,.7);font-size:13px}
  @media(max-width:640px){.hero h1{font-size:28px}.hero-stats{gap:24px}}

  /* ===== Filter chips ===== */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin:-28px auto 0;position:relative;z-index:5;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{padding:7px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);
    font-size:13.5px;color:var(--ink-2);font-weight:500;transition:.18s}
  .chip:hover{border-color:var(--red)}
  .chip.active{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:700}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;min-width:200px}
  .search input{border:none;outline:none;font-size:14px;width:100%;background:transparent}
  @media(max-width:640px){.toolbar{flex-direction:column;align-items:stretch}.search{min-width:0}}

  /* ===== Section heads ===== */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:46px 0 22px}
  .sec-head h2{font-size:23px;font-weight:800}
  .sec-head h2 i{color:var(--red);font-style:normal}
  .sec-head p{color:var(--ink-3);font-size:14px}

  /* ===== Expert grid ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .ecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px;box-shadow:var(--shadow-sm);transition:.22s;cursor:pointer;position:relative;overflow:hidden}
  .ecard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(226,35,26,.25)}
  .ecard .ribbon{position:absolute;top:16px;right:-34px;transform:rotate(45deg);
    background:var(--gold);color:#3a2a05;font-size:11px;font-weight:800;padding:4px 40px;letter-spacing:1px}
  .ec-top{display:flex;gap:16px;align-items:center}
  .avatar{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
    font-size:26px;font-weight:800;color:#fff;flex:none;box-shadow:var(--shadow-sm)}
  .av-zh{background:linear-gradient(135deg,#2b3a67,#16203d)}
  .av-lqz{background:linear-gradient(135deg,#ff6a5a,var(--red-deep))}
  .ec-top h3{font-size:19px;font-weight:800}
  .ec-top .title{color:var(--red);font-size:13.5px;font-weight:600;margin-top:2px}
  .ec-rating{margin-top:4px;font-size:12.5px;color:var(--ink-3)}
  .ec-rating b{color:var(--ink)}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
  .tag{font-size:12px;color:var(--ink-2);background:#F2F3F8;border-radius:6px;padding:4px 9px}
  .ec-bio{color:var(--ink-2);font-size:14px;min-height:44px}
  .ec-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;
    padding-top:16px;border-top:1px solid var(--line)}
  .ec-price{font-size:13px;color:var(--ink-3)}
  .ec-price b{color:var(--red);font-size:18px;font-weight:800}
  .btn-line{border:1px solid var(--red);color:var(--red);padding:8px 16px;border-radius:9px;font-weight:600;font-size:13.5px;transition:.18s}
  .ecard:hover .btn-line{background:var(--red);color:#fff}
  .bot-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#15a05a;font-weight:600}
  .bot-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#19c46a;box-shadow:0 0 0 3px rgba(25,196,106,.18)}

  /* ===== Detail view ===== */
  .view{display:none}
  .view.active{display:block}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;margin:24px 0 4px;font-weight:500}
  .back:hover{color:var(--red)}
  .profile{background:var(--space);color:#fff;border-radius:22px;padding:34px;position:relative;overflow:hidden;margin-top:14px}
  .profile .glow{position:absolute;left:-80px;bottom:-120px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#ff7a5a,transparent 70%);opacity:.4}
  .pf-inner{position:relative;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .pf-avatar{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;font-size:40px;font-weight:800;flex:none}
  .pf-meta h2{font-size:28px;font-weight:800}
  .pf-meta .title{color:var(--gold);font-weight:600;margin-top:4px}
  .pf-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pf-tags .tag{background:rgba(255,255,255,.12);color:#fff}
  .pf-stats{display:flex;gap:30px;margin-left:auto;flex-wrap:wrap}
  .pf-stats div b{font-size:22px;font-weight:800}
  .pf-stats div small{display:block;color:rgba(255,255,255,.7);font-size:12.5px}
  .pf-cta{margin-top:22px}
  .pf-cta .cta{font-size:15px;padding:11px 24px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm)}
  .panel h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .panel h3 .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);font-size:15px}
  .panel .sub{color:var(--ink-3);font-size:13px;margin-bottom:16px}
  .svc{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
  .svc:first-of-type{border-top:none}
  .svc .ck{color:var(--red);font-weight:800;flex:none}
  .svc .t b{font-size:14.5px}
  .svc .t p{color:var(--ink-2);font-size:13px}
  .vas{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px;transition:.18s}
  .vas:hover{border-color:var(--red);background:#fffafa}
  .vas .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .vas b{font-size:15px}
  .vas .price{color:var(--red);font-weight:800;font-size:15px;white-space:nowrap}
  .vas p{color:var(--ink-2);font-size:13px;margin-top:5px}

  /* ===== Chatbox ===== */
  .chat{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .chat-head{display:flex;align-items:center;gap:12px;padding:16px 22px;background:linear-gradient(90deg,#fff,#fff7f6);border-bottom:1px solid var(--line)}
  .chat-head .bavatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
  .chat-head .info b{font-size:15.5px}
  .chat-head .info small{display:block;color:#15a05a;font-size:12px;font-weight:600}
  .chat-head .badge{margin-left:auto;font-size:11.5px;color:var(--ink-3);background:#F2F3F8;padding:5px 10px;border-radius:8px}
  .msgs{height:420px;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;background:
    radial-gradient(1px 1px at 15% 20%,#eef0f6,transparent),
    radial-gradient(1px 1px at 80% 60%,#eef0f6,transparent),var(--bg)}
  .msg{display:flex;gap:10px;max-width:84%}
  .msg .b-av{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .bubble{padding:11px 15px;border-radius:14px;font-size:14.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word;min-width:0}
  .msg.bot .bubble{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;color:var(--ink);white-space:normal}
  .msg.bot .bubble h1,.msg.bot .bubble h2,.msg.bot .bubble h3,.msg.bot .bubble h4{font-weight:800;margin:11px 0 5px;color:var(--ink);line-height:1.35}
  .msg.bot .bubble h1{font-size:17px}.msg.bot .bubble h2{font-size:16px}
  .msg.bot .bubble h3,.msg.bot .bubble h4{font-size:14.5px}
  .msg.bot .bubble p{margin:6px 0}
  .msg.bot .bubble ul,.msg.bot .bubble ol{margin:6px 0 6px 20px;padding:0}
  .msg.bot .bubble li{margin:3px 0}
  .msg.bot .bubble strong{font-weight:700;color:var(--ink)}
  .msg.bot .bubble em{font-style:italic}
  .msg.bot .bubble code{background:#f2f3f8;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .msg.bot .bubble pre{background:#0f1320;color:#e6e8f0;border-radius:10px;padding:12px 14px;overflow:auto;margin:8px 0}
  .msg.bot .bubble pre code{background:none;border:none;color:inherit;padding:0}
  .msg.bot .bubble a{color:var(--red);text-decoration:underline}
  .msg.bot .bubble hr{border:none;border-top:1px solid var(--line);margin:10px 0}
  .msg.bot .bubble blockquote{border-left:3px solid var(--red);background:#fff7f6;margin:8px 0;padding:6px 12px;color:var(--ink-2);border-radius:0 8px 8px 0}
  .msg.bot .bubble>:first-child{margin-top:0}.msg.bot .bubble>:last-child{margin-bottom:0}
  .msg.bot .bubble .md-table{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
  .msg.bot .bubble table{border-collapse:collapse;width:100%;font-size:13px}
  .msg.bot .bubble th,.msg.bot .bubble td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;white-space:nowrap}
  .msg.bot .bubble thead th{background:#f7f8fc;font-weight:700;color:var(--ink)}
  .msg.bot .bubble tbody tr:nth-child(even){background:#fafbfe}
  .copy-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-top:8px;padding:0;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink-3);cursor:pointer;transition:.15s}
  .copy-btn:hover{color:var(--red);border-color:#f3b8b4;background:var(--red-soft)}
  .copy-btn.done{color:#15a05a;border-color:#bfe6cf;background:#f0fbf4}
  .copy-btn svg{width:14px;height:14px}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg.user .bubble{background:var(--red);color:#fff;border-top-right-radius:4px}
  .msg.user .b-av{background:#2b3a67}
  .msg .atts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .att-img{width:120px;height:90px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
  .att-file{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    padding:7px 11px;border-radius:9px;font-size:12.5px}
  .msg.bot .att-file{background:#f2f3f8;border-color:var(--line);color:var(--ink-2)}
  .typing{display:flex;gap:4px;padding:13px 16px}
  .typing span{width:7px;height:7px;border-radius:50%;background:#c4c8d6;animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  .composer{border-top:1px solid var(--line);padding:12px 16px;background:#fff}
  .preview{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px}
  .pv{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .pv img{width:62px;height:62px;object-fit:cover;display:block}
  .pv .file{display:flex;align-items:center;gap:7px;padding:9px 11px;font-size:12.5px;color:var(--ink-2);max-width:200px}
  .pv .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff}
  .comp-row{display:flex;align-items:flex-end;gap:4px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:6px 6px 6px 8px;transition:.2s cubic-bezier(.4,0,.2,1);
    box-shadow:0 1px 2px rgba(22,26,43,.04),0 6px 16px rgba(22,26,43,.05)}
  .comp-row:focus-within{border-color:#f3b8b4;
    box-shadow:0 1px 2px rgba(22,26,43,.04),0 8px 24px rgba(226,35,26,.12)}
  .tool{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;
    color:var(--ink-3);font-size:17px;transition:.16s;flex:none;cursor:pointer}
  .tool:hover{color:var(--red);background:var(--red-soft)}
  .tool:active{transform:scale(.92)}
  .tool:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:var(--ink-3)}
  .tool.rec{color:#fff;background:var(--red);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,35,26,.35)}50%{box-shadow:0 0 0 6px rgba(226,35,26,0)}}
  .composer textarea{flex:1;resize:none;border:none;background:transparent;padding:8px 6px;font-size:14.5px;
    font-family:inherit;outline:none;max-height:120px;line-height:1.55;align-self:center;color:var(--ink)}
  .composer textarea::placeholder{color:var(--ink-3)}
  .send{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,#ff6a5a 0%,var(--red) 55%,var(--red-deep) 100%);
    color:#fff;display:grid;place-items:center;font-size:16px;flex:none;transition:.2s cubic-bezier(.4,0,.2,1);
    box-shadow:0 3px 9px rgba(226,35,26,.3)}
  .send:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 6px 16px rgba(226,35,26,.4)}
  .send:active{transform:translateY(0) scale(.97)}
  .send:disabled{background:#d2d5e0;box-shadow:none;cursor:not-allowed;transform:none}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:8px;text-align:center}

  footer{margin:60px 0 40px;text-align:center;color:var(--ink-3);font-size:13px}
  footer b{color:var(--ink-2)}
  .err{background:#fff3f2;border:1px solid #f5c2bd;color:var(--red-deep);font-size:13px;padding:11px 14px;border-radius:10px;margin:0 22px 14px}

  /* ===== 移动端适配 ===== */
  @media(max-width:640px){
    .wrap{padding:0 16px}
    /* 顶栏 */
    .nav{height:58px}
    .brand{font-size:17px}
    .brand small{display:none}
    .planet{width:26px;height:26px}
    .cta{white-space:nowrap;padding:8px 14px;font-size:13px}
    /* Hero */
    .hero-inner{padding-top:42px;padding-bottom:46px}
    .hero h1{font-size:25px;line-height:1.3}
    .hero p{font-size:14.5px;margin-top:12px}
    .hero-stats{gap:22px;margin-top:24px;flex-wrap:wrap}
    .hero-stats div b{font-size:22px}
    .hero .glow{width:240px;height:240px;right:-90px;top:-90px}
    /* 工具栏 / 卡片 */
    .sec-head{margin:32px 0 16px}
    .sec-head h2{font-size:20px}
    .ecard{padding:20px}
    .ec-foot{flex-wrap:wrap;gap:12px}
    /* Profile 头部 */
    .profile{padding:22px;border-radius:18px}
    .pf-inner{gap:16px}
    .pf-avatar{width:66px;height:66px;border-radius:18px;font-size:30px}
    .pf-meta h2{font-size:22px}
    .pf-stats{margin-left:0;gap:20px;width:100%;margin-top:4px}
    .pf-stats div b{font-size:19px}
    .pf-cta{margin-top:18px}
    .pf-cta .cta{width:100%;text-align:center}
    /* 服务面板 */
    .panel{padding:18px;border-radius:14px}
    .cols{gap:16px;margin-top:18px}
    /* 聊天区 */
    .chat{margin-top:18px}
    .chat-head{padding:13px 16px}
    .chat-head .badge{display:none}
    .msgs{height:min(60vh,460px);padding:16px 14px;gap:12px}
    .msg{max-width:92%}
    .bubble{font-size:14px}
    .att-img{width:100px;height:76px}
    .composer{padding:10px 12px}
    /* iOS 聚焦不自动放大：输入字号需 ≥16px */
    .composer textarea{font-size:16px}
    .err{margin:0 14px 12px}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a class="brand" href="#/">
      <span class="planet"></span>
      红色星球 <small>RED PLANET · 财税专家</small>
    </a>
    <nav class="links">
      <a href="#/">首页</a>
      <a href="#/experts" class="active">专家市场</a>
      <a href="#/">服务</a>

/* 复制按钮 */
const COPY_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const CHECK_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const COPY_BTN='<button class="copy-btn" title="复制">'+COPY_ICON+'</button>';
function fallbackCopy(text,cb){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); cb&&cb(); }catch(_){}
  document.body.removeChild(ta);
}
function copyBubble(btn){
  const bubble=btn.closest(".bubble"); if(!bubble) return;
  const text=bubble.innerText.trim();
  const done=()=>{ btn.classList.add("done"); btn.innerHTML=CHECK_ICON;
    setTimeout(()=>{ btn.classList.remove("done"); btn.innerHTML=COPY_ICON; },1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else{ fallbackCopy(text,done); }
}
if(!window.__copyBound){
  window.__copyBound=true;
  document.addEventListener("click",ev=>{ const b=ev.target.closest&&ev.target.closest(".copy-btn"); if(b) copyBubble(b); });
}

function bindChat(e){
  attachments=[]; sessionId=null;
  const input=document.getElementById("input");
  const send=document.getElementById("send");
  const docIn=document.getElementById("file-doc");

  input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px";});
  input.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();doSend(e);}});
  input.addEventListener("paste",ev=>{
    const imgs=[...(ev.clipboardData?.items||[])]
      .filter(it=>it.kind==="file"&&it.type.startsWith("image/"))
      .map(it=>it.getAsFile()).filter(Boolean);
    if(imgs.length){ ev.preventDefault(); addFiles(imgs,"image"); }
  });
  send.onclick=()=>doSend(e);
  docIn.onchange=ev=>addFiles(ev.target.files,"file");
  bindMic(input);
}

/* 语音输入：Web Speech API 语音转文字，识别结果填入输入框 */
let recog=null, listening=false;
function bindMic(input){
  const mic=document.getElementById("mic");
  if(!mic) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ mic.onclick=()=>showErr("当前浏览器不支持语音输入，请使用 Chrome 或 Edge。"); return; }
  let base="";
  mic.onclick=()=>{
    if(listening){ recog&&recog.stop(); return; }
    recog=new SR();
    recog.lang="zh-CN"; recog.interimResults=true; recog.continuous=false;
    base=input.value?input.value+" ":"";
    recog.onstart=()=>{ listening=true; mic.classList.add("rec"); mic.title="正在聆听，点击停止"; };
    recog.onresult=ev=>{
      let txt="";
      for(let i=0;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
      input.value=base+txt;
      input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px";
    };
    recog.onerror=ev=>{ if(ev.error!=="aborted"&&ev.error!=="no-speech") showErr("语音识别失败："+ev.error); };
    recog.onend=()=>{ listening=false; mic.classList.remove("rec"); mic.title="语音输入"; input.focus(); };
    recog.start();
  };
}

    r.readAsDataURL(f);
  });
  document.getElementById("file-doc").value="";
}

/* 轻量 Markdown 渲染（用于 AI 回复）：标题/粗斜体/列表/引用/代码/链接/分隔线 */
function mdInline(s){
  return escapeHtml(s)
    .replace(/`([^`]+?)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/__(.+?)__/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(md){
  if(!md) return "";
  const lines=md.replace(/\r\n/g,"\n").split("\n");
  let html="",inUl=false,inOl=false,inCode=false,codeBuf="";
  const closeLists=()=>{if(inUl){html+="</ul>";inUl=false;}if(inOl){html+="</ol>";inOl=false;}};
  const splitRow=s=>s.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const isSep=s=>/-/.test(s)&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(s);
  for(let i=0;i<lines.length;i++){
    let raw=lines[i];
    // 代码块 ```
    if(/^\s*```/.test(raw)){
      if(inCode){html+="<pre><code>"+escapeHtml(codeBuf)+"</code></pre>";inCode=false;codeBuf="";}
      else{closeLists();inCode=true;codeBuf="";}
      continue;
    }
    if(inCode){codeBuf+=(codeBuf?"\n":"")+raw;continue;}
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()){closeLists();continue;}
    // 表格：当前行含 |，且下一行是分隔行（|---|---|）
    if(line.indexOf("|")>=0 && i+1<lines.length && isSep(lines[i+1])){
      closeLists();
      const headers=splitRow(line);
      const aligns=splitRow(lines[i+1]).map(c=>{const l=c.startsWith(":"),r=c.endsWith(":");return l&&r?"center":r?"right":l?"left":"";});
      i++; // 跳过分隔行
      const rows=[];
      while(i+1<lines.length && lines[i+1].indexOf("|")>=0 && lines[i+1].trim()){ i++; rows.push(splitRow(lines[i])); }
      let t='<div class="md-table"><table><thead><tr>';
      headers.forEach((h,idx)=>{t+=`<th${aligns[idx]?` style="text-align:${aligns[idx]}"`:""}>${mdInline(h)}</th>`;});
      t+="</tr></thead><tbody>";
      rows.forEach(r=>{t+="<tr>";for(let idx=0;idx<headers.length;idx++){t+=`<td${aligns[idx]?` style="text-align:${aligns[idx]}"`:""}>${mdInline(r[idx]||"")}</td>`;}t+="</tr>";});
      t+="</tbody></table></div>";
      html+=t;continue;
    }
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){closeLists();html+="<hr>";continue;}
    let m;
    if(m=line.match(/^(#{1,6})\s+(.*)$/)){closeLists();const lv=Math.min(m[1].length,6);html+=`<h${lv}>${mdInline(m[2])}</h${lv}>`;continue;}
    if(m=line.match(/^\s*>\s?(.*)$/)){closeLists();html+=`<blockquote>${mdInline(m[1])}</blockquote>`;continue;}
    if(m=line.match(/^\s*[-*+]\s+(.*)$/)){if(inOl){html+="</ol>";inOl=false;}if(!inUl){html+="<ul>";inUl=true;}html+=`<li>${mdInline(m[1])}</li>`;continue;}
    if(m=line.match(/^\s*\d+[.)]\s+(.*)$/)){if(inUl){html+="</ul>";inUl=false;}if(!inOl){html+="<ol>";inOl=true;}html+=`<li>${mdInline(m[1])}</li>`;continue;}
    closeLists();
    html+=`<p>${mdInline(line)}</p>`;
  }
  if(inCode)html+="<pre><code>"+escapeHtml(codeBuf)+"</code></pre>";
  closeLists();
  return html;
}
function showErr(msg){const e=document.getElementById("chat-err");e.innerHTML=`<div class="err">${msg}</div>`;}
function clearErr(){const e=document.getElementById("chat-err");if(e)e.innerHTML="";}

async function doSend(expert){
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text && !attachments.length)return;
  clearErr();
  const sent=[...attachments];
  pushMsg("user",text,sent,expert.initial,expert.pfAvBg);
  input.value="";input.style.height="auto";attachments=[];renderPreview();

  // typing 指示
  const m=document.getElementById("msgs");
  const t=document.createElement("div");t.className="msg bot";
  t.innerHTML=`<div class="b-av" style="background:${expert.pfAvBg}">${expert.initial}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  m.appendChild(t);m.scrollTop=m.scrollHeight;
  document.getElementById("send").disabled=true;

  try{
    const bubble=t.querySelector(".bubble");
    const reply=await callBailian(text,sent,expert,(full)=>{
      bubble.innerHTML=mdToHtml(full);
      m.scrollTop=m.scrollHeight;
    });
    bubble.innerHTML=mdToHtml(reply)+COPY_BTN;
  }catch(err){
    t.remove();
    showErr("调用失败："+err.message+"　（若为 CORS/网络问题，请运行随附 proxy.js 并把 CONFIG.bailian.useProxy 设为 true）");
  }finally{
    document.getElementById("send").disabled=false;
    m.scrollTop=m.scrollHeight;
  }
}

/* 通过代理把本地文件上传到百炼临时 OSS，返回 oss:// 链接 */
async function uploadFileViaProxy(att){
  const cfg=CONFIG.bailian;
  const res=await fetch(cfg.proxyBase+"/upload-file",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      filename:att.name, contentType:att.mime,
      dataBase64:(att.dataUrl.split(",")[1]||""), model:cfg.fileModel
    })
  });
  const txt=await res.text();
  if(!res.ok) throw new Error("文件「"+att.name+"」上传失败：HTTP "+res.status+" "+txt);
  let j;try{j=JSON.parse(txt);}catch(_){throw new Error("文件上传返回异常："+txt.slice(0,160));}
  if(!j.ossUrl) throw new Error("文件上传未返回链接："+txt.slice(0,160));
  return j.ossUrl;
}

/* 调用百炼「智能体应用」completion 接口（支持图片 + 文件多模态） */
async function callBailian(text,atts,expert,onChunk){
  const cfg=CONFIG.bailian;
  const appId=(expert&&expert.appId)||cfg.appId;
  if(!appId||appId.indexOf("APP_ID")>-1) throw new Error("该专家尚未配置 app_id（应用 ID）");

  const imgs=atts.filter(a=>a.kind==="image");
  const files=atts.filter(a=>a.kind==="file");

  const body={input:{prompt:text||"请查看我上传的内容并解答。"}, parameters:{}, debug:{}};
  if(sessionId) body.input.session_id=sessionId;

  // 图片：base64 直传 image_list（需应用为 VL 视觉模型）
  if(imgs.length) body.input.image_list=imgs.map(i=>i.dataUrl);

  // 文件：先上传得到 oss:// 链接，放入 file_list（需开启代理）
  if(files.length){
    if(!cfg.useProxy) throw new Error("读取文件需先开启代理：运行「node proxy.js」并把 CONFIG.bailian.useProxy 设为 true。（图片可直接发送，无需代理）");
    const urls=[];
    for(const f of files){ urls.push(await uploadFileViaProxy(f)); }
    body.input.file_list=urls;
  }

  // 流式输出：开启 SSE 与增量返回
  body.parameters.incremental_output=true;

  const base=cfg.useProxy?cfg.proxyBase:cfg.directBase;
  const url=base+"/api/v1/apps/"+appId+"/completion";
  const headers={"Content-Type":"application/json","X-DashScope-SSE":"enable"};
  if(!cfg.useProxy){                              // 直连时本页注入；代理模式由 proxy 注入
    headers["Authorization"]="Bearer "+cfg.apiKey;
    headers["X-DashScope-OssResourceResolve"]="enable";
  }

  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)});
  if(!res.ok){
    let detail="";try{detail=JSON.stringify(await res.json());}catch(_){detail=res.statusText;}
    throw new Error("HTTP "+res.status+" "+detail);
  }

  // 读取 SSE 流，逐块累加并回调渲染
  const reader=res.body.getReader();
  const decoder=new TextDecoder();
  let buf="", full="";
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=decoder.decode(value,{stream:true});
    let nl;
    while((nl=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
      if(!line.startsWith("data:")) continue;
      const payload=line.slice(5).trim();
      if(!payload||payload==="[DONE]") continue;
      let j; try{ j=JSON.parse(payload); }catch(_){ continue; }
      if(j.output){
        if(j.output.session_id) sessionId=j.output.session_id;
        const delta=j.output.text||j.output.response||"";
        if(delta){ full+=delta; onChunk&&onChunk(full); }
      }
    }
  }
  if(!full) throw new Error("返回为空");
  return full;
}

function showView(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("active"));
  document.getElementById(v).classList.add("active");
  window.scrollTo(0,0);
}

function route(){
  const h=location.hash||"#/experts";
  const mExpert=h.match(/#\/expert\/(\w+)/);

}
